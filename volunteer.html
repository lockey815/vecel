<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer — JS Health Initiative East Africa</title>
<meta name="description" content="A Ugandan non-profit supporting communities through digital skilling, public health education, research and surgical care support.">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css"></head>
<body><div id="nav"></div>
<section class="section"><div class="container"><h2>Volunteer with us</h2><p class="section-lead">Tell us about yourself and how you'd like to help. We'll be in touch.</p>
<form class="stacked-form" data-type="volunteer" novalidate>
<label>Full name<input name="name" maxlength="100" required></label>
<label>Email<input name="email" type="email" required></label>
<label>Phone (optional)<input name="phone" type="tel" maxlength="30"></label>
<label>Skills / how you'd like to help<textarea name="skills" rows="4" maxlength="3000" required></textarea></label>
<button class="btn btn-large">Submit application</button><p class="form-status" role="status"></p></form></div></section>
<div id="foot"></div><script src="config.js"></script><script src="app.js"></script></body></html>
